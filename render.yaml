services:
  - type: web
    name: alimentador-iot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEVICE_TOKEN
        sync: false
      - key: DEVICE_CODE
        value: ESP32-001
      - key: COOKIE_SECURE
        value: '1'
      - key: FLASK_DEBUG
        value: '0'
